<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Carbon Footprint Tracker</h1>
    <h2>Calculate your environmental impact in minutes and discover simple, everyday steps to protect our planet. 🌍</h2>
</header>
<div class="container">
<form id="footprint-form">
<section>
    <h2>🚗 Transport</h2>
    <div class="form-group">
        <label for="driving">Driving (km per week)</label>
        <input type="number" id="driving" min="0" required>
    </div>
    <div class="form-group">
        <label for="public-transport">Public Transport (km per week)</label>
        <input type="number" id="public-transport" min="0" required>
    </div>
    <div class="form-group">
        <label for="flights">Flights Taken (per year)</label>
        <input type="number" id="flights" min="0" required>
    </div>
</section>   
<section>
    <h2>⚡ Home Energy</h2>
    <div class="form-group">
        <label for="electricity">Electricity (kWh per month)</label>
        <input type="number" id="electricity" min="0" required>
    </div>
    <div class="form-group">
        <label for="heating">Natural Gas Heating (kWh per month)</label>
        <input type="number" id="heating" min="0" required>
    </div>
    <div class="form-group">
        <label for="people">People Living in the Household</label>
        <input type="number" id="people" min="1" required>
    </div>
</section>    
<section>
    <h2>🥗 Diet</h2>
    <div class="diet-group">
    <div class="diet-btn">
        <input type="radio" id="meat-heavy" name="diet" value="2.5" required>
        <label for="meat-heavy">Meat-Heavy</label>
    </div>
    <div class="diet-btn">
        <input type="radio" id="average" name="diet" value="1.8">
        <label for="average">Average</label>
    </div>
    <div class="diet-btn">
        <input type="radio" id="low-meat" name="diet" value="1.4">
        <label for="low-meat">Low-meat</label>
    </div>
    <div class="diet-btn">
        <input type="radio" id="pescatarian" name="diet" value="1.2">
        <label for="pescatarian">Pescatarian</label>
    </div>
    <div class="diet-btn">
        <input type="radio" id="vegetarian" name="diet" value="1.0">
        <label for="vegetarian">Vegetarian</label>
    </div>
    <div class="diet-btn">
        <input type="radio" id="vegan" name="diet" value="0.7">
        <label for="vegan">Vegan</label>
    </div>
    </div>
</section>
    <div class="form-actions">
        <button type="submit" id="submit-btn">Calculate My Footprint</button>
    </div>
</form>   
<div class="results-column">
<h2 class="sidebar-title">📊 Results</h2>
<aside class="sidebar">
    <div id="status" class="status-badge status-average"></div>
    <div class="metric">
        <div class="metric-val" id="total-footprint"></div>
        <div class="metric-unit">tonnes CO₂e / year</div>
    </div>
    <div id="breakdown">
        
    </div>
    <div id="comparison-box">
        <div>Global 2030 Average Target:</div>
        <div class="comparison-line">
            <span><span class="target-val">2.5</span> <span class="target-unit">tonnes CO₂e / year</span></span>
        <div class="comparison-line" id="target-comparison">
        </div>
    </div>
</aside> 
</div>
</div>
<script src="script.js" defer></script>
</body>
</html>
